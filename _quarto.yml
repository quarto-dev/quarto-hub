project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!notes/"
    - "!README.md"

website:
  title: "Quarto Hub"
  description: "Quarto Hub renders your Quarto project in the browser as you type."
  site-url: https://quarto-dev.github.io/quarto-hub
  repo-url: https://github.com/quarto-dev/quarto-hub
  favicon: images/quarto-icon.svg
  open-graph: true
  navbar:
    logo: https://quarto-hub.com/quarto-icon.svg
    logo-alt: "Quarto"
    title: "Quarto Hub"
    left:
      - href: index.qmd
        text: Overview
      - href: get-started.qmd
        text: Get started
      - href: how-it-works.qmd
        text: How it works
    right:
      - text: "Open Hub"
        href: https://quarto-hub.com
      - icon: github
        href: https://github.com/quarto-dev/quarto-hub
        aria-label: GitHub
  page-footer:
    left: |
      Quarto Hub is a preview from the [Quarto](https://quarto.org) team at [Posit](https://posit.co). Something broken? [File an issue](https://github.com/quarto-dev/quarto-hub/issues).
    right:
      - text: quarto.org
        href: https://quarto.org
      - icon: github
        href: https://github.com/quarto-dev/quarto-hub

format:
  html:
    theme: theme.scss
    toc: false
    link-external-newwindow: true
