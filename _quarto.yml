project:
  type: website
  output-dir: _site

website:
  title: "Quarto Hub"
  description: "Quarto, together. A shared editor for Quarto projects."
  site-url: https://quarto-dev.github.io/quarto-hub
  repo-url: https://github.com/quarto-dev/quarto-hub
  favicon: images/quarto-icon.svg
  open-graph: true
  navbar:
    logo: images/quarto-icon.svg
    logo-alt: "Quarto"
    title: "Quarto Hub"
    left:
      - href: index.qmd
        text: Overview
      - href: how-it-works.qmd
        text: How it works
    right:
      - text: "Open Hub"
        href: https://quarto-hub.com
      - icon: github
        href: https://github.com/quarto-dev/quarto-hub
        aria-label: GitHub
  page-footer:
    left: |
      Quarto Hub is a preview from the [Quarto](https://quarto.org) team at [Posit](https://posit.co). Something broken? [File an issue](https://github.com/quarto-dev/quarto-hub/issues).
    right:
      - text: quarto.org
        href: https://quarto.org
      - icon: github
        href: https://github.com/quarto-dev/quarto-hub

format:
  html:
    theme: theme.scss
    toc: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
