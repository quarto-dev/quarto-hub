name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Enables Pages (source: GitHub Actions) if it isn't already.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Strip Hub-only frontmatter and review comments
        run: python3 scripts/prepare-publish.py .

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
